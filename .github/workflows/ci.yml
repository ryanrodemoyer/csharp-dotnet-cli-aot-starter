name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore NativeAotCliTemplate.slnx

      - name: Build solution
        run: dotnet build NativeAotCliTemplate.slnx -c Release --no-restore

      - name: Run test suite
        run: dotnet test NativeAotCliTemplate.slnx -c Release --no-build --verbosity normal

      - name: Smoke test Native AOT compilation
        run: |
          dotnet publish src/NativeAotCli/NativeAotCli.csproj -c Release
